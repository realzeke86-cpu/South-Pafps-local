<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>South Pafps Packaging Supplies — POS System</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!--LOGIN PAGE-->
  <div id="login-page">
    <div class="login-bg-texture"></div>
    <!-- Top-left brand bar -->
    <div class="login-topbar">
      <div class="login-topbar-brand">
        <img src="logo.png" alt="South Pafps Logo" class="login-topbar-logo">
        <div class="login-topbar-text">
          <strong>South Pafps</strong>
          <span>Packaging Supplies</span>
        </div>
      </div>
    </div>

    <!-- Centered login card -->
    <div class="login-center">
      <div class="login-card">
        <div class="login-card-header">
          <h2>Welcome back</h2>
          <p>Sign in to your account to continue.</p>
        </div>
        <div id="login-error" class="alert-error"></div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" class="form-control" placeholder="Enter your username"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="form-group" style="margin-bottom:6px;">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="login-password" class="form-control" placeholder="Enter your password"
              autocomplete="new-password">
            <button type="button" class="pw-eye" onclick="togglePwVisibility('login-password', this)" tabindex="-1" aria-label="Toggle password visibility">
              <svg id="login-password-eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="login-forgot-row">
          <a href="#" class="login-forgot-link" onclick="showForgotPassword(event)">Forgot password?</a>
        </div>
        <button class="btn-primary" style="margin-top:20px;" onclick="doLogin()">Sign In →</button>
      </div>
      <div class="login-footer-note">© 2026 South Pafps Packaging Supplies · Multi-Branch POS System v1.0</div>
    </div>
  </div>

  <!-- Hidden overview div (kept for JS compatibility) -->
  <div id="overview-page" class="hidden"></div>

  <!--APP SHELL-->
  <div id="app-page" class="hidden">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo-mark"><img src="logo.png" alt="South Pafps Logo"
            style="height:32px;width:auto;display:block;border-radius:8px;"></div>
        <div class="sidebar-brand-text">
          <strong>South Pafps</strong>
          <span>Packaging Supplies</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>

    <!-- Main -->
    <div class="main-area">
      <div class="topbar">
        <div class="topbar-breadcrumb">
          <span class="bc-home">🏠</span>
          <span class="bc-sep">›</span>
          <span class="bc-page" id="topbar-page">Dashboard</span>
          <span class="bc-sub" id="topbar-sub"></span>
        </div>
        <div class="topbar-right">
          <div class="topbar-branch-badge" id="topbar-branch">Main Branch</div>
          <div class="topbar-date" id="topbar-date"></div>
          <div class="topbar-account" id="topbar-account">
            <button class="topbar-account-trigger" id="topbar-account-trigger" onclick="toggleAccountMenu(event)">
              <div class="topbar-account-avatar" id="sb-avatar">A</div>
              <div class="topbar-account-info">
                <strong id="sb-name">Admin</strong>
                <span id="sb-role">Administrator</span>
              </div>
              <span class="topbar-account-caret">▾</span>
            </button>
            <div class="topbar-account-menu" id="topbar-account-menu">
              <button class="topbar-account-signout" onclick="doLogout()">Sign Out</button>
            </div>
          </div>
        </div>
      </div>
      <div class="page-content" id="page-content"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modal container -->
  <div id="modal-container"></div>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>

</html>
